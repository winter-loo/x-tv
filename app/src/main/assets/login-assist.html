<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X TV · 辅助登录</title>
<style>
:root{color-scheme:dark;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#101216;color:#edf0f4}
*{box-sizing:border-box}
body{max-width:900px;margin:auto;padding:24px 20px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:18px;font-weight:600;letter-spacing:.02em;margin:0;white-space:nowrap}
p{color:#9da5b1;line-height:1.5}
button,input{font:inherit;border-radius:10px;padding:14px;border:1px solid #3d424c;background:#1b1e24;color:inherit}
button{cursor:pointer;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid #a9c8f4;outline-offset:3px}
button:disabled{opacity:.5}
form{display:flex;gap:10px;margin:16px 0}
input{min-width:0;flex:1}
#keyboard{margin-top:24px}
#keyboard label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}
#typing{margin:0}
#text{width:100%;font-size:17px;background:#1b1e24}
input::placeholder{color:#959daa}
#screen{display:block;width:100%;height:auto;min-height:120px;background:#191c22;border:1px solid #343944;border-radius:12px;cursor:crosshair;touch-action:manipulation}
#status{font-size:12px;margin:0;text-align:right}
#action-status{font-size:13px;min-height:20px;margin:8px 0 0;color:#abbdd5}
.hint{font-size:13px;margin:8px 0 0}
[hidden]{display:none!important}
@media(max-width:480px){body{padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom))}header{margin-bottom:16px}#keyboard{margin-top:20px}#pair{flex-wrap:wrap}#code{flex-basis:180px}}
</style>
<header><h1>X TV · 辅助登录</h1><p id="status" role="status">等待连接</p></header>
<form id="pair"><input id="code" aria-label="投影仪配对码" placeholder="投影仪上的 8 位配对码" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" required><button>连接投影仪</button></form>
<main id="remote" hidden>
<img id="screen" alt="电视当前画面，点击输入框即可操作" draggable="false">
<section id="keyboard">
<label for="text">手机输入</label>
<form id="typing"><input id="text" type="text" aria-label="直接输入到电视当前焦点" aria-describedby="typing-hint action-status" placeholder="输入文字，同步到电视" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="2048" enterkeyhint="go"></form>
<p id="typing-hint" class="hint">点画面中的输入框，再输入；按回车确认。</p>
<p id="action-status" role="status" aria-live="polite"></p>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let token='',running=false,frameUrl='',failures=0,shadow='',composing=false,syncBlocked=false;
let commands=Promise.resolve();

function clearProxy(){shadow='';composing=false;$('text').value='';}
function end(message){running=false;token='';clearProxy();$('code').value='';$('remote').hidden=true;$('pair').hidden=true;$('status').textContent=message;if(frameUrl)URL.revokeObjectURL(frameUrl);frameUrl='';$('screen').removeAttribute('src');}
async function request(path,data){const response=await fetch(path,{method:data===undefined?'GET':'POST',cache:'no-store',credentials:'omit',headers:{...(token?{Authorization:'Bearer '+token}:{}),...(data===undefined?{}:{'Content-Type':'application/json'})},body:data===undefined?undefined:JSON.stringify(data),signal:AbortSignal.timeout(8000)});if(!response.ok)throw Error(String(response.status));return response;}
function connectionError(error){if(error.message==='401'||error.message==='410'){end('连接已结束，请在投影仪重新开启辅助登录。');return true;}return false;}
function enqueue(data,needsSync=false){
  commands=commands.then(async()=>{
    if(!running||(needsSync&&syncBlocked))return false;
    try{await request('/input',data);if(needsSync)$('action-status').textContent='已同步';return true;}
    catch(error){if(connectionError(error))return false;if(needsSync){syncBlocked=true;$('action-status').textContent='同步中断，文字已保留。请重新点选上方输入框。';}else $('action-status').textContent='操作没有送达，请查看电视画面后重试。';return false;}
  });
  return commands;
}
async function pair(code,button){
  if(button)button.disabled=true;
  $('status').textContent='正在连接投影仪…';
  try{token=(await(await request('/pair',{code})).json()).token;$('code').value='';running=true;$('pair').hidden=true;$('remote').hidden=false;$('status').textContent='正在获取画面…';poll();}
  catch(error){$('pair').hidden=false;$('code').value=code;$('status').textContent='连接失败：请检查配对码；连续输错 5 次后需在投影仪重新开启。';}
  finally{if(button)button.disabled=false;}
}
$('pair').onsubmit=event=>{event.preventDefault();pair($('code').value,event.submitter);};
async function poll(){while(running){try{const blob=await(await request('/frame')).blob();if(!running)return;const next=URL.createObjectURL(blob);$('screen').src=next;if(frameUrl)URL.revokeObjectURL(frameUrl);frameUrl=next;failures=0;$('status').textContent='已连接';}catch(error){if(error.message==='503'&&++failures<4){await new Promise(resolve=>setTimeout(resolve,700));continue;}end('连接已结束或暂时中断。请查看投影仪；如尚未登录，请重新开启辅助登录。');return;}await new Promise(resolve=>setTimeout(resolve,700));}}

function sync(){
  if(composing||!running)return;
  const value=$('text').value;let common=0;
  while(common<shadow.length&&common<value.length&&shadow[common]===value[common])common++;
  const deletion=shadow.length-common,insertion=value.slice(common);
  shadow=value;
  if(deletion||insertion)enqueue({kind:'edit',delete:deletion,text:insertion},true);
  try{$('text').setSelectionRange(value.length,value.length);}catch(ignored){}
}
$('text').addEventListener('compositionstart',()=>{composing=true;});
$('text').addEventListener('compositionend',()=>{composing=false;sync();});
$('text').addEventListener('input',sync);
$('text').addEventListener('focus',()=>{const length=$('text').value.length;try{$('text').setSelectionRange(length,length);}catch(ignored){}});
$('typing').onsubmit=event=>{event.preventDefault();commands=commands.then(async()=>{if(!running||syncBlocked)return false;try{await request('/input',{kind:'key',key:'Enter'});clearProxy();$('text').focus();$('action-status').textContent='已确认';return true;}catch(error){if(!connectionError(error))$('action-status').textContent='确认没有送达，文字仍保留在手机。';return false;}});};
$('screen').onclick=event=>{
  const bounds=event.currentTarget.getBoundingClientRect(),tap={kind:'tap',x:(event.clientX-bounds.left)/bounds.width,y:(event.clientY-bounds.top)/bounds.height};
  clearProxy();$('text').focus({preventScroll:true});
  commands=commands.then(async()=>{if(!running)return false;try{await request('/input',tap);syncBlocked=false;$('action-status').textContent='可以输入';return true;}catch(error){if(!connectionError(error))$('action-status').textContent='没有选中电视输入框，请再点一次画面。';return false;}});
};
window.addEventListener('pagehide',()=>end('连接已结束'));

const invitation=new URLSearchParams(location.hash.slice(1)).get('code');
if(invitation){history.replaceState(null,'',location.pathname+location.search);$('pair').hidden=true;pair(invitation);}
</script></html>
