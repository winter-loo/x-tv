name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
        env:
          TMPDIR: /var/tmp
      - run: npm test
      - run: python3 scripts/package-release.py --help
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install compile SDK
        run: '$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.1" "build-tools;36.0.0"'
        env:
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/var/tmp
      - name: Check debug and unsigned release
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease lintDebug lintRelease --console=plain
